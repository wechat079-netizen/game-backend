<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 PvP XO Battle</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 420px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 18px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .user-info { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 15px; color: #38bdf8; }
        .balance-info { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; font-weight: bold; font-size: 14px; }
        
        #matchmaking-screen { display: block; }
        #game-screen { display: none; }
        
        .bet-box { background: #334155; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; }
        select { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: none; background: #1e293b; color: white; font-size: 16px; text-align: center; }
        
        .btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        
        .searching-box { display: none; margin-top: 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top: 4px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #status { font-size: 16px; margin-bottom: 12px; color: #38bdf8; font-weight: bold; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .cell { background: #334155; height: 95px; font-size: 45px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; color: #f8fafc; }
        .cell:active { background: #475569; }
        .info-text { font-size: 12px; color: #94a3b8; margin-top: 5px; text-align: center; }
        
        .history-box { background: #0f172a; padding: 10px; border-radius: 10px; margin-top: 15px; text-align: left; max-height: 120px; overflow-y: auto; font-size: 12px; border: 1px solid #334155; }
        .history-item { padding: 5px 0; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header: ဘယ်ဘက် နာမည်၊ ညာဘက် ငွေလက်ကျန် -->
        <div class="header">
            <div class="user-info">
                <span>👤</span> <span id="name">Loading...</span>
            </div>
            <div class="balance-info">
                <span>💰</span> <span id="user-money">Loading...</span>
            </div>
        </div>

        <!-- 1. Matchmaking Screen -->
        <div id="matchmaking-screen">
            <h2>⚔️ 1v1 PvP Arena</h2>
            <p style="color: #94a3b8; font-size: 13px;">လောင်းကြေးတူညီသူများနှင့်သာ ချိတ်ဆက်မည်</p>
            
            <div class="bet-box">
                <label>လောင်းကြေးရွေးချယ်ပါ (MMK)</label>
                <select id="bet-amount">
                    <option value="1000">1,000 MMK</option>
                    <option value="5000">5,000 MMK</option>
                    <option value="10000">10,000 MMK</option>
                </select>
                <div class="info-text">💡 နိုင်ပါက ၁၀၀ လျှင် ၁၉၀ နှုန်းဖြင့် ပြန်ရမည်</div>
            </div>

            <button class="btn" onclick="findMatch()">🚀 ပွဲရှာမည် (Find Match)</button>

            <div class="searching-box" id="searching-box">
                <div class="spinner"></div>
                <p id="search-status">လောင်းကြေးတူ ပြိုင်ဘက် ရှာဖွေနေသည်...</p>
                <button class="btn btn-danger" onclick="cancelSearch()">ပွဲရှာဖွေခြင်း ဖျက်သိမ်းမည်</button>
            </div>

            <div class="history-box" id="history-box">
                <div style="font-weight: bold; color: #38bdf8; margin-bottom: 4px;">📜 ကစားခဲ့သော မှတ်တမ်းများ</div>
                <div id="history-list" style="color: #94a3b8;">မှတ်တမ်း မရှိသေးပါ။</div>
            </div>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen">
            <div id="status">ချိတ်ဆက်နေသည်...</div>
            <div class="board" id="board">
                <div class="cell" onclick="makeMove(0)"></div>
                <div class="cell" onclick="makeMove(1)"></div>
                <div class="cell" onclick="makeMove(2)"></div>
                <div class="cell" onclick="makeMove(3)"></div>
                <div class="cell" onclick="makeMove(4)"></div>
                <div class="cell" onclick="makeMove(5)"></div>
                <div class="cell" onclick="makeMove(6)"></div>
                <div class="cell" onclick="makeMove(7)"></div>
                <div class="cell" onclick="makeMove(8)"></div>
            </div>
            <div class="info-text" style="color: #ef4444; margin-top: 10px;">⚠️ ပွဲစနေစဉ် မထွက်ရပါ</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://right-2c598-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        let uid = urlParams.get('uid') || "3lxCl5C7fIOlK9n0Bv5iA9Xbf5J3"; // UID မပါပါက Test UID သုံးမည်

        let currentMoney = 0;
        let activeRoomId = localStorage.getItem("activeRoomId_" + uid) || null;
        let myRole = localStorage.getItem("myRole_" + uid) || ""; 
        let selectedBet = 0;
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let turn = "X";
        let gameOver = false;
        let rewardProcessed = false;

        // Firebase မှ User အချက်အလက် (Name နှင့် Money) ကို တိုက်ရိုက်လှမ်းယူခြင်း
        const userRef = db.ref(`user/${uid}`);
        userRef.once('value', (snapshot) => {
            if (!snapshot.exists()) {
                userRef.set({
                    username: "User_" + uid.slice(-4),
                    money: 10000 
                });
            }
        });

        userRef.on('value', (snapshot) => {
            if(snapshot.exists()) {
                const userData = snapshot.val();
                currentMoney = userData.money || 0;
                document.getElementById("user-money").innerText = currentMoney.toLocaleString() + " MMK";
                if(userData.username) {
                    document.getElementById("username").innerText = userData.username; // UID အစား Database ထဲက နာမည်အမှန်ကို ပြမည်
                }
            }
        });

        loadMatchHistory();

        if (activeRoomId) {
            db.ref(`matchmaking/rooms/${activeRoomId}`).once('value', (snapshot) => {
                const roomData = snapshot.val();
                if (roomData && !roomData.gameOver && (roomData.player1 === uid || roomData.player2 === uid)) {
                    startGameSession();
                } else {
                    localStorage.removeItem("activeRoomId_" + uid);
                    localStorage.removeItem("myRole_" + uid);
                    activeRoomId = null;
                }
            });
        }

        // UID သီးသန့်အလျောက် Match History များကို ဆွဲထုတ်ပြသခြင်း
        function loadMatchHistory() {
            db.ref(`user_history/${uid}`).limitToLast(5).on('value', (snapshot) => {
                const historyList = document.getElementById("history-list");
                historyList.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const h = child.val();
                        let color = h.result === "WIN" ? "#10b981" : (h.result === "LOSS" ? "#ef4444" : "#fbbf24");
                        let sign = h.result === "WIN" ? "+" : (h.result === "LOSS" ? "-" : "");
                        let item = document.createElement("div");
                        item.className = "history-item";
                        item.innerHTML = `<span>XO (${h.bet.toLocaleString()} MMK)</span> <span style="color: ${color}; font-weight: bold;">${h.result} (${sign}${h.amount.toLocaleString()})</span>`;
                        historyList.prepend(item);
                    });
                } else {
                    historyList.innerHTML = "မှတ်တမ်း မရှိသေးပါ။";
                }
            });
        }

        // မှတ်တမ်းသိမ်းဆည်းရာတွင် အနိုင်/အရှုံး ပမာဏအမှန်ကို ထည့်သွင်းခြင်း
        function saveHistory(resultText, betAmount, payoutAmount) {
            db.ref(`user_history/${uid}`).push({
                bet: betAmount,
                result: resultText,
                amount: payoutAmount,
                timestamp: Date.now()
            });
        }

        function findMatch() {
            selectedBet = parseInt(document.getElementById("bet-amount").value);
            
            if (currentMoney < selectedBet) {
                alert("ငွေလက်ကျန် မလုံလောက်ပါ။");
                return;
            }

            // လုံခြုံရေးပိုင်း: Transaction ဖြင့် ငွေဖြတ်ခြင်း
            db.ref(`user/${uid}/money`).transaction((money) => {
                if (money === null || money < selectedBet) return;
                return money - selectedBet;
            }, (error, committed) => {
                if (committed) {
                    startQueueProcess();
                } else {
                    alert("ငွေဖြတ်ယူရာတွင် အမှားအယွင်းရှိပါသည်။");
                }
            });
        }

        function startQueueProcess() {
            document.getElementById("searching-box").style.display = "block";
            document.querySelector("#matchmaking-screen .btn").style.display = "none";

            const queueRef = db.ref("matchmaking/queue");
            queueRef.once('value', (snapshot) => {
                let matchedRoom = null;
                snapshot.forEach((childSnapshot) => {
                    let roomData = childSnapshot.val();
                    if (roomData.status === "waiting" && roomData.bet === selectedBet && roomData.player1 !== uid) {
                        matchedRoom = childSnapshot.key;
                    }
                });

                if (matchedRoom) {
                    activeRoomId = matchedRoom;
                    myRole = "O";
                    localStorage.setItem("activeRoomId_" + uid, activeRoomId);
                    localStorage.setItem("myRole_" + uid, myRole);

                    db.ref(`matchmaking/rooms/${activeRoomId}`).update({
                        player2: uid,
                        status: "playing"
                    });
                    db.ref(`matchmaking/queue/${activeRoomId}`).remove();
                    startGameSession();
                } else {
                    const newRoomRef = db.ref("matchmaking/rooms").push();
                    activeRoomId = newRoomRef.key;
                    myRole = "X";
                    localStorage.setItem("activeRoomId_" + uid, activeRoomId);
                    localStorage.setItem("myRole_" + uid, myRole);

                    newRoomRef.set({
                        player1: uid,
                        player2: "",
                        bet: selectedBet,
                        status: "waiting",
                        board: ["","","","","","","","",""],
                        turn: "X",
                        gameOver: false,
                        winner: "",
                        lastActive: Date.now()
                    });

                    db.ref(`matchmaking/queue/${activeRoomId}`).set({
                        bet: selectedBet,
                        status: "waiting",
                        player1: uid
                    });

                    waitForOpponent();
                }
            });
        }

        function waitForOpponent() {
            db.ref(`matchmaking/rooms/${activeRoomId}/status`).on('value', (snapshot) => {
                if (snapshot.val() === "playing") {
                    db.ref(`matchmaking/queue/${activeRoomId}`).remove();
                    startGameSession();
                }
            });
        }

        function cancelSearch() {
            if (activeRoomId) {
                db.ref(`matchmaking/rooms/${activeRoomId}`).remove();
                db.ref(`matchmaking/queue/${activeRoomId}`).remove();
                db.ref(`user/${uid}/money`).transaction((money) => (money || 0) + selectedBet);
            }
            localStorage.removeItem("activeRoomId_" + uid);
            localStorage.removeItem("myRole_" + uid);
            document.getElementById("searching-box").style.display = "none";
            document.querySelector("#matchmaking-screen .btn").style.display = "block";
            activeRoomId = null;
        }

        function startGameSession() {
            document.getElementById("matchmaking-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";
            rewardProcessed = false;

            const heartbeatInterval = setInterval(() => {
                if (activeRoomId && !gameOver) {
                    db.ref(`matchmaking/rooms/${activeRoomId}/lastActive_${myRole}`).set(Date.now());
                } else {
                    clearInterval(heartbeatInterval);
                }
            }, 3000);

            db.ref(`matchmaking/rooms/${activeRoomId}`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                boardState = data.board;
                turn = data.turn;
                gameOver = data.gameOver;

                updateGameUI();

                const opponentRole = (myRole === "X") ? "O" : "X";
                const oppLastActive = data[`lastActive_${opponentRole}`] || 0;
                if (!gameOver && data.status === "playing" && (Date.now() - oppLastActive > 12000)) {
                    db.ref(`matchmaking/rooms/${activeRoomId}`).update({
                        gameOver: true,
                        winner: myRole
                    });
                }

                if (gameOver && !rewardProcessed) {
                    rewardProcessed = true;
                    clearInterval(heartbeatInterval);
                    
                    if (data.winner === myRole) {
                        let payout = Math.floor(data.bet * 1.9);
                        db.ref(`user/${uid}/money`).transaction((money) => (money || 0) + payout);
                        saveHistory("WIN", data.bet, payout);
                        alert("🎉 ဂုဏ်ယူပါတယ်! သင် နိုင်သွားပါပြီ (+ " + payout.toLocaleString() + " MMK)");
                    } else if (data.winner === "Draw") {
                        db.ref(`user/${uid}/money`).transaction((money) => (money || 0) + data.bet);
                        saveHistory("DRAW", data.bet, data.bet);
                        alert("🤝 ပွဲပြီးပါပြီ (သရေကျသဖြင့် လောင်းကြေး ပြန်အမ်းပါသည်)");
                    } else if (data.winner && data.winner !== "Draw") {
                        saveHistory("LOSS", data.bet, data.bet);
                        alert("❌ ရှုံးနိမ့်သွားပါပြီ (- " + data.bet.toLocaleString() + " MMK)");
                    }

                    localStorage.removeItem("activeRoomId_" + uid);
                    localStorage.removeItem("myRole_" + uid);
                }
            });
        }

        function updateGameUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                cell.innerText = boardState[index];
            });

            const statusDiv = document.getElementById('status');
            if (gameOver) {
                statusDiv.innerText = "🏁 ဂိမ်းပြီးဆုံးသွားပါပြီ!";
                setTimeout(() => { location.reload(); }, 3000);
            } else if (turn === myRole) {
                statusDiv.innerText = "✨ သင့်အလှည့် (" + myRole + ")";
            } else {
                statusDiv.innerText = "⏳ ပြိုင်ဘက်၏ အလှည့် (" + turn + ")...";
            }
        }

        function makeMove(index) {
            if (gameOver || turn !== myRole || boardState[index] !== "") return;

            boardState[index] = myRole;
            let winner = checkWinner();
            let isGameOver = false;
            let winningSymbol = "";

            if (winner) {
                isGameOver = true;
                winningSymbol = winner;
            } else if (!boardState.includes("")) {
                isGameOver = true;
                winningSymbol = "Draw";
            } else {
                turn = (myRole === "X") ? "O" : "X";
            }

            db.ref(`matchmaking/rooms/${activeRoomId}`).update({
                board: boardState,
                turn: turn,
                gameOver: isGameOver,
                winner: winningSymbol,
                [`lastActive_${myRole}`]: Date.now()
            });
        }

        function checkWinner() {
            const patterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let p of patterns) {
                const [a, b, c] = p;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    return boardState[a];
                }
            }
            return null;
        }
    </script>
</body>
</html>
